name: Rebuild catalogs

# Weekly rebuild: Sundays 11:00 UTC = 06:00 EST. Kids catalogs barely change,
# so weekly is plenty. Run manually any time from the Actions tab.
on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalogs from TMDB
        run: python3 scripts/build_catalogs.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "Kids Only Bot"
          git config user.email "kids-only@users.noreply.github.com"
          git add catalog
          git diff --cached --quiet || git commit -m "Weekly catalog rebuild $(date -u +%Y-%m-%d)"
          git push
